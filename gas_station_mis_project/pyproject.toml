[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "gas_station_mis"
version = "0.1.0"
description = "Custom gas station operations for ERPNext and Frappe HR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gas Station MIS Contributors" }]
dependencies = []

[tool.flit.module]
name = "gas_station_mis"

[tool.ruff]
line-length = 100
target-version = "py310"
